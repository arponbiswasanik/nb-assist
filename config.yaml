# NB Assist — central configuration
# All runtime values live here. Nothing in code should be hard-coded.

ollama:
  host: "127.0.0.1"
  port: 11434
  timeout_s: 60
  keep_alive_s: 300          # keep model warm between calls (warm-up at startup)

models:
  primary: "gemma3:4b"        # selected because it produced usable Bangla script in smoke tests
  embedding: "bge-m3"          # runs on CPU, frees VRAM for the LLM
  rejected_baseline: "qwen2.5:3b"   # kept for ablation evidence; failed Bangla smoke test
  rejected_reason: "Bangla script gibberish, invented facts in smoke test"

paths:
  faq: "data/bank-faq.csv"
  test_questions: "data/test-questions.csv"
  answer_bank: "data/answer_bank.csv"
  paraphrase_index: "data/paraphrase_index.csv"
  dev_set: "data/dev_set.csv"
  test_gold: "data/test_gold.csv"
  idk_templates: "data/idk_templates.csv"
  banglish_variants: "data/banglish_variants.csv"
  results_dir: "results"

# Language detection — deterministic, by code
language:
  bn_char_threshold: 0.30     # share of Bangla-block chars above this => bn
  ties_to: "en"               # ambiguous latin-script => English
  banglish_lexicon:
    - ami       # I
    - amar      # my
    - koto      # how much
    - kibhabe   # how (variant)
    - kivabe    # how (variant)
    - kemne     # how (variant)
    - korbo     # will do
    - korchi    # am doing
    - ki        # what
    - jay       # go/can
    - hobe      # will be
    - lage      # need/feel
    - ache      # have/is
    - nai       # not
    - ta        # it
    - er        # of (possessive)
  char_ngram_range: [3, 4]    # for Banglish vs English scoring

# Retrieval — hybrid dense + lexical, fused
retrieval:
  top_k: 3
  dense_weight: 0.7
  lexical_weight: 0.3
  fusion: "weighted_sum"      # alternative: "rrf" (reciprocal rank fusion)
  char_ngram_range: [3, 5]   # for lexical TF-IDF (robust to Banglish spelling variance)
  return_margins: true        # gap between top-1 and top-2

# Gate — the hardest part. Three signals, three zones.
# Thresholds below are PLACEHOLDERS — calibrate on dev_set only, never on test_gold.
gate:
  t_low: 0.45                 # below => handoff (placeholder, calibrate)
  t_high: 0.70               # above with no slot flag + good margin => candidate (placeholder)
  margin_min: 0.10            # min gap between top-1 and top-2 for candidate
  slot_check_enabled: true
  slot_keywords:              # tokens that, if absent in matched FAQ, flag a near-miss
    - Singapore
    - Sylhet
    - student
    - crypto
    - gold
    - dollar
    - visa
    - share
  verifier_enabled: true
  verifier_skip_above: 0.85   # very high score => skip verifier (latency optimization)
  verifier_prompt_template: "Does this FAQ entry directly answer the customer's question? Reply YES or NO only.\n\nFAQ entry: {faq}\nQuestion: {question}"

# Generation — guarded, low temperature, bounded length
generation:
  temperature: 0
  max_tokens: 200
  num_fewshot: 2              # per language
  keep_numbers_unchanged: true
  script_instruction: true    # explicit per-language script rule in prompt

# Validators — deterministic, run after generation
validators:
  script_check: true          # Banglish/EN must not contain Bangla chars
  fact_check: true             # numbers, amounts, phones must come from source
  extra_content_check: true    # low-overlap sentences flagged as invented
  length_check: true
  loop_check: true
  retry_on_fail: 1
  fallback_to_verified: true  # send verified answer verbatim if retry also fails

# Tracing — log per-stage scores and decision path
trace:
  enabled: true
  log_path: "results/trace.jsonl"
  mask_digits: true           # privacy: mask digits in logs
  store_raw_text: false       # do not store raw customer text by default

# Evaluation
eval:
  languages: ["en", "bn", "banglish"]
  metrics:
    - retrieval_top1_accuracy
    - answer_correctness
    - idk_recall
    - false_handoff_rate
    - unsafe_answers
    - language_match
    - latency_p50
    - latency_p95
    - path_mix
  run_cold_warm_split: true
  seed: 42